name: Deploy to Netlify

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        # IMPORTANT: 
        # - NETLIFY_SITE_ID secret must be the "Site ID" of the Netlify site that has chanclazo.com as custom domain (get it from Netlify UI > your site > Site settings > General > Site ID)
        # - NETLIFY_AUTH_TOKEN must be a valid token from Netlify (user settings > Applications > Personal access tokens, with "Deploy" permission)
        # If this step fails, check the logs for the exact error (auth, site id, build, etc.)
        run: npx netlify-cli deploy --prod --dir=dist --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --site ${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
