[build]
  command = "npm run build"
  publish = "dist"

# Proxy API routes to the Cloudflare Worker
# This lets the entire site (frontend + API) live under the custom domain chanclazo.com
# without CORS or changing the frontend code (uses relative /score etc.)
[[redirects]]
  from = "/score"
  to = "https://chanclazo-worker.betrnames.workers.dev/score"
  status = 200
  force = true

[[redirects]]
  from = "/leaderboard"
  to = "https://chanclazo-worker.betrnames.workers.dev/leaderboard"
  status = 200
  force = true

[[redirects]]
  from = "/ghost"
  to = "https://chanclazo-worker.betrnames.workers.dev/ghost"
  status = 200
  force = true

[[redirects]]
  from = "/ghost/*"
  to = "https://chanclazo-worker.betrnames.workers.dev/ghost/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/presence/*"
  to = "https://chanclazo-worker.betrnames.workers.dev/presence/:splat"
  status = 200
  force = true

# Redirect www to apex (recommended for custom domain on Netlify DNS)
[[redirects]]
  from = "https://www.chanclazo.com/*"
  to = "https://chanclazo.com/:splat"
  status = 301
  force = true

# SPA fallback for client-side routing (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
