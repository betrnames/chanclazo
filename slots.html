<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#ff8a5c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas#game{display:block;width:100%;height:100%;flex:1;min-height:0}
.hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top);display:flex;align-items:center;gap:8px;padding:8px 10px;pointer-events:none;z-index:5}
.hud .pill{pointer-events:auto;background:#c2185b;border:2px solid #5a2a00;border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;display:flex;flex-direction:column;line-height:1.15}
.hud .pill small{font-size:10px;opacity:.75;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.hud a,.hud button{pointer-events:auto;background:#18b5b0;border:2px solid #5a2a00;border-radius:12px;color:#fff;font-weight:900;padding:8px 12px;font-size:14px;text-decoration:none;cursor:pointer}
.hud .spacer{flex:1}
.disclaimer{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom);text-align:center;font-size:10px;color:#5a2a00;font-weight:700;padding:4px 8px;pointer-events:none;z-index:5}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(122,31,79,.55);z-index:10;padding:16px;overflow:auto}
.screen.hidden{display:none}
.card{background:#c2185b;border:4px solid #5a2a00;border-radius:22px;padding:22px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 0 #5a2a00}
.card img.logo{width:72px;height:72px}
.card h1{margin:8px 0 6px;font-size:clamp(26px,7vw,36px);color:#ffd23f;font-weight:900;line-height:1.05}
.card .sub{font-size:13px;opacity:.85;font-style:italic;margin:0 0 12px}
.card p{margin:0 0 10px;font-size:15px;line-height:1.4}
.card .keys{font-size:13px;text-align:left;background:#7a1f4f;border-radius:12px;padding:10px 12px;margin:12px 0}
.card button{background:#ffd23f;color:#2a0a00;border:3px solid #fff;border-radius:16px;font-weight:900;font-size:22px;padding:12px 28px;cursor:pointer;box-shadow:0 6px 0 #7c2d12}
.card button:active{transform:translateY(3px);box-shadow:0 3px 0 #7c2d12}
.card .links{margin-top:14px;font-size:13px}.card .links a{color:#ffd23f}
@font-face{font-family:LilitaOne;src:url(/fonts/LilitaOne-Regular.ttf) format("truetype");font-display:swap}
.screen.title{background:linear-gradient(180deg,rgba(255,193,94,.82),rgba(255,138,92,.8) 40%,rgba(226,73,122,.8) 75%,rgba(142,68,201,.85));flex-direction:column;justify-content:center;gap:8px;text-align:center;padding:56px 16px 16px}
.tt-heads{display:flex;align-items:flex-end;justify-content:center;gap:2vmin}
.tt-heads img{width:clamp(56px,min(14vmin,11vh),120px);filter:drop-shadow(0 4px 0 #5a2a00)}
.tt-heads img.pin{width:clamp(110px,min(30vmin,24vh),260px);transform-origin:50% 0;animation:swing 2.6s ease-in-out infinite;order:0}
.tt-ch{position:absolute;height:clamp(64px,min(16vmin,15vh),150px);aspect-ratio:1;pointer-events:none;perspective:500px;display:block}
.tt-ch img,.tt-ch .lit{position:absolute;left:8%;top:6%;width:84%;height:84%;object-fit:contain;animation:yaw 4s ease-in-out infinite;transform-style:preserve-3d}
.tt-ch img{filter:drop-shadow(-2px -2px 0 #fff1b8) drop-shadow(0 3px 2px rgba(90,42,0,.5)) drop-shadow(4px 10px 8px rgba(58,20,80,.45))}
.tt-ch .lit{-webkit-mask:var(--f) center/contain no-repeat;mask:var(--f) center/contain no-repeat;background:radial-gradient(circle at 32% 25%,rgba(255,255,255,.42),rgba(255,255,255,0) 45%,rgba(60,20,90,.38) 100%)}
.tt-ch .med{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9b8ff,#8a5cc8 60%,#4a2a78);border:3px solid #ffd23f;box-shadow:inset -6px -8px 14px rgba(40,10,70,.45),inset 4px 5px 10px rgba(255,255,255,.35),0 8px 14px rgba(58,20,80,.45)}
@keyframes yaw{0%,100%{transform:rotateY(-14deg) rotateX(4deg) translateY(0)}50%{transform:rotateY(14deg) rotateX(-3deg) translateY(-4px)}}
.tt-lu img,.tt-lu .lit{animation-delay:-1.3s}.tt-ca img,.tt-ca .lit{animation-delay:-2.6s}
.tt-ab{left:3vw;bottom:6vh;transform:rotate(-8deg)}
.tt-lu{left:4vw;top:22vh;transform:rotate(-6deg)}
.tt-ca{right:4vw;top:34vh;transform:rotate(7deg)}
@media (max-aspect-ratio:1/1){.tt-ab{left:3vw;bottom:3vh}.tt-lu{left:3vw;top:13vh}.tt-ca{right:3vw;top:13vh}.tt-ch{height:clamp(60px,19vw,110px)}}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.tt-title{margin:0;font-family:LilitaOne,system-ui,sans-serif;font-weight:400;font-size:clamp(48px,min(15vmin,11vh),130px);line-height:.92;color:#ffd23f;letter-spacing:2px;-webkit-text-stroke:clamp(5px,1.4vmin,10px) #5a2d86;paint-order:stroke fill;text-shadow:0 6px 0 #3b1a5c}
.tt-ribbon{background:#e2197a;color:#fff;font-family:LilitaOne,system-ui,sans-serif;font-size:clamp(16px,3.6vmin,28px);padding:6px 34px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);letter-spacing:1px}
.tt-tap{margin-top:8px;font-family:LilitaOne,system-ui,sans-serif;font-size:clamp(26px,6vmin,46px);color:#fff;background:#18b5b0;border:4px solid #5a2a00;border-radius:999px;padding:10px 34px;cursor:pointer;box-shadow:0 6px 0 #5a2a00;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.tt-menu{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.tt-menu button,.tt-menu a{font-family:LilitaOne,system-ui,sans-serif;font-size:18px;color:#fff;background:#7b3fbf;border:3px solid #5a2a00;border-radius:14px;padding:8px 18px;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 #5a2a00}
