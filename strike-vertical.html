<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="googlebot" content="noindex,nofollow" />
<meta name="theme-color" content="#14061f" />
<title>Chancla Strike Vertical (preview) · Chanclazo</title>
<link rel="icon" href="/cruise/logo_chancla.webp" />
<link rel="preload" as="image" type="image/webp" href="/s3d/chancla_gold.webp" crossorigin="anonymous" />
<link rel="preload" as="image" type="image/webp" href="/s3d/skull.webp" crossorigin="anonymous" />
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@font-face{font-family:LilitaOne;src:url(/fonts/LilitaOne-Regular.woff2) format("woff2");font-display:swap}
html,body{margin:0;height:100%;background:#0b0312;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#stage{touch-action:none;position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100dvh * 9 / 16));overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.8);
  background:linear-gradient(180deg,rgba(14,4,28,.55),rgba(14,4,28,.45) 50%,rgba(30,8,24,.7)),url(/play/night_bg.webp) 50% 30%/cover,#140a24}
#stage canvas{touch-action:none;display:block;width:100%;height:100%;cursor:grab}
.hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top);display:flex;align-items:flex-start;gap:6px;padding:8px;z-index:5;pointer-events:none}
.hud a,.hud button,.pill{pointer-events:auto;background:rgba(36,9,47,.88);border:2px solid #ffb347;border-radius:12px;color:#ffd23f;font-weight:900;padding:5px 8px;font-size:12px;text-decoration:none;cursor:pointer;line-height:1.15}
.pill{display:flex;flex-direction:column;align-items:center;color:#fff;pointer-events:none;white-space:nowrap;font-size:14px}
.pill small{font-size:9px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;color:#ffd23f}
.sp{flex:1}
#shots{letter-spacing:-2px}
#shots img{width:20px;height:20px;vertical-align:-4px;margin-right:2px}
#shots img.used{opacity:.22;filter:grayscale(1)}
#hint{position:absolute;bottom:calc(26% );left:0;right:0;text-align:center;font:400 19px LilitaOne,system-ui;color:#ffd23f;text-shadow:0 2px 0 #2a0a00,0 0 10px #000;z-index:5;pointer-events:none;transition:opacity .4s}
#hint.off{opacity:0}
#banner{position:absolute;top:34%;left:0;right:0;text-align:center;font:400 clamp(30px,10vw,44px) LilitaOne,system-ui;color:#ffd23f;-webkit-text-stroke:2px #5a1a00;paint-order:stroke fill;text-shadow:0 4px 0 #2a0a00;z-index:6;pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
#banner.on{opacity:1;transform:scale(1)}
.pop{position:absolute;z-index:6;pointer-events:none;font:400 20px LilitaOne,system-ui;color:#fff;-webkit-text-stroke:1.5px #5a1a00;paint-order:stroke fill;transform:translate(-50%,-50%);animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-46px}}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,3,15,.72);z-index:10;padding:16px}
.hidden{display:none!important}
.card{background:radial-gradient(ellipse at 50% 30%,#3a1556,#160620 72%);border:3px solid #ffb347;border-radius:20px;padding:20px;max-width:340px;width:100%;text-align:center;box-shadow:0 0 36px rgba(255,170,60,.3)}
.card h1{margin:4px 0 8px;font:400 32px LilitaOne,system-ui;color:#ffd23f}
.card p{margin:0 0 10px;font-size:15px}
.stars{font-size:40px;letter-spacing:6px;color:#ffd23f}.stars .off{color:#4a3358}
.card button{font:400 22px LilitaOne,system-ui;background:#ffd23f;color:#2a0a00;border:3px solid #fff;border-radius:14px;padding:10px 24px;cursor:pointer;margin:4px}
.card button.alt{background:#3a1d55;color:#ffd23f;border-color:#ffb347;font-size:18px}
.card a{color:#ffd23f;font-size:13px}
.tag{position:absolute;right:8px;bottom:calc(max(4px,env(safe-area-inset-bottom)) + 4px);z-index:4;font:700 9px system-ui;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);pointer-events:none}
</style>
</head><body>
<div id="stage">
  <div class="hud">
    <a href="/choose" aria-label="Back to game selection">←</a>
    <span class="pill"><small>Level</small><span><span id="lvl">1</span>/3</span></span>
    <span class="pill"><small>Score</small><span id="score">0</span></span>
    <span class="pill"><small>Chanclas</small><span id="shots"></span></span>
    <span class="sp"></span>
    <button id="restart" aria-label="Restart level">↻</button>
    <button id="mute" aria-label="Sound on or off">🔊</button>
  </div>
  <div id="hint">Pull down, let go to fling it up</div>
  <div id="banner"></div>
  <div class="screen hidden" id="end"><div class="card">
    <h1 id="endTitle">¡Chanclazo!</h1>
    <div class="stars" id="stars"></div>
    <p id="endMsg"></p>
    <button id="next">Next level</button>
    <button id="retry" class="alt">Retry</button>
    <div><a href="/choose">← All games</a></div>
  </div></div>
  <div class="tag">Preview · <span class="cz-build">%%CZ_BUILD%%</span></div>
</div>
<script type="module" src="/src/play/strikeVertical.ts"></script>
</body></html>
