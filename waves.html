<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.hbtn{pointer-events:auto;width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff2a8,#ffd23f 50%,#f4a000);border:3px solid #3b1a5c;border-radius:14px;box-shadow:0 4px 0 #3b1a5c;color:#3b1a5c;font:900 18px system-ui;cursor:pointer;padding:0}

#bomb{position:absolute;left:0;bottom:22px;top:auto;width:70px;height:70px;border-radius:50%;padding:0;margin:0;border:4px solid #3b1a5c;background:radial-gradient(circle at 50% 38%,#ffcf6a,#ff6a1a 55%,#a8101e);box-shadow:0 6px 0 #1a0826,inset 0 0 0 3px #ffd23f;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;filter:none;transform:none;animation:none;pointer-events:auto}
#snack{position:absolute;left:0;bottom:108px;width:70px;height:70px;border-radius:50%;padding:0;margin:0;border:4px solid #3b1a5c;background:radial-gradient(circle at 50% 38%,#fff6d4,#ff8c1a 70%,#c45a00);box-shadow:0 6px 0 #1a0826,inset 0 0 0 3px #ffd23f;cursor:pointer;touch-action:none;pointer-events:auto}
#snack img{width:52px;height:52px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}

#snack .use{position:absolute;left:50%;top:-16px;bottom:auto;transform:translateX(-50%);font:400 12px LilitaOne,system-ui;letter-spacing:.08em;color:#ffd23f;-webkit-text-stroke:3px #3b1a5c;paint-order:stroke fill;white-space:nowrap;pointer-events:none}

#snack.press{transform:translateY(3px)}
#bomb img{width:52px;height:auto;pointer-events:none;transform:rotate(-24deg);filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
#bomb .bb{position:absolute;left:-6px;top:-8px;font-size:22px;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.6))}
#bomb .bn{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;border-radius:12px;background:#3b1a5c;border:2px solid #ffd23f;color:#fff;font:400 14px/20px LilitaOne,system-ui;text-align:center;pointer-events:none}
#bomb .use{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font:400 12px LilitaOne,system-ui;letter-spacing:.08em;color:#ffd23f;-webkit-text-stroke:3px #3b1a5c;paint-order:stroke fill;white-space:nowrap;pointer-events:none}
#bomb.ghost{opacity:.34;pointer-events:none;box-shadow:0 6px 0 #1a0826,inset 0 0 0 3px rgba(255,210,63,.45)}
#bomb.ghost .use{visibility:hidden}
#bomb.ready{box-shadow:0 6px 0 #1a0826,inset 0 0 0 3px #ffd23f,0 0 16px rgba(255,140,40,.8)}
#bomb.press{transform:translateY(3px)}
@keyframes bglow{from{box-shadow:0 6px 0 #1a0826,inset 0 0 0 3px #ffd23f,0 0 10px rgba(255,120,40,.5)}to{box-shadow:0 6px 0 #1a0826,inset 0 0 0 3px #ffd23f,0 0 22px rgba(255,170,60,.9)}}
#bomb.ready{animation:bglow 1s ease-in-out infinite alternate}

#sticky{position:absolute;left:0;bottom:194px;width:70px;height:70px;border-radius:50%;padding:0;margin:0;border:4px solid #3b1a5c;background:radial-gradient(circle at 50% 38%,#fffce6,#18c8c0 52%,#ff8c1a 92%);box-shadow:0 6px 0 #1a0826,inset 0 0 0 3px #ffd23f;cursor:pointer;touch-action:none;pointer-events:auto}
#sticky img{width:50px;height:auto;pointer-events:none;transform:rotate(-18deg);filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
#sticky .bn{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;border-radius:12px;background:#3b1a5c;border:2px solid #ffd23f;color:#fff;font:400 14px/20px LilitaOne,system-ui;text-align:center;pointer-events:none}
#sticky .use{position:absolute;left:50%;top:-16px;bottom:auto;transform:translateX(-50%);font:400 12px LilitaOne,system-ui;letter-spacing:.08em;color:#ffd23f;-webkit-text-stroke:3px #3b1a5c;paint-order:stroke fill;white-space:nowrap;pointer-events:none}
#sticky.ghost{opacity:.34;pointer-events:none;box-shadow:0 6px 0 #1a0826,inset 0 0 0 3px rgba(255,210,63,.45)}

#sticky.placing{box-shadow:0 6px 0 #1a0826,inset 0 0 0 3px #fff,0 0 24px rgba(24,200,192,1);animation:bglow 0.7s ease-in-out infinite alternate}

@media (max-height:700px){
  #powers{height:232px}
  #sticky{bottom:168px;width:60px;height:60px}

/* Abuela between-wave cameo: slides in from the left, says one line, slides out. Tap her to skip.
   The start-of-game walk-in is a separate intro on Waves, Strike, and Slots.
   Hide the img until its src is set (deferred until she first speaks). Safari otherwise
   paints a gray empty-image frame at the HTML width (507px), which overflows the
   translateX(-110%) park and shows as a thin rectangle on the left of the plaza. */
#abuela{position:absolute;left:0;bottom:calc(env(safe-area-inset-bottom) + 25%);z-index:9;display:flex;align-items:flex-end;pointer-events:none;transform:translateX(-110%);transition:transform .45s cubic-bezier(.5,0,.75,0);max-width:96%}
#abuela.in{transform:translateX(0);transition:transform .45s cubic-bezier(.2,1.35,.45,1);pointer-events:auto;cursor:pointer}
#abuela img{height:clamp(150px,30vh,260px);width:auto;aspect-ratio:507/1002;flex:none;margin-left:-6px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
#abuela img:not([src]){display:none}
#abuela.in img{animation:abob .9s ease-in-out infinite alternate}
@keyframes abob{from{transform:rotate(-2deg)}to{transform:rotate(2deg) translateY(-4px)}}
#abuela .bubble{position:relative;margin:0 0 clamp(90px,17vh,170px) 2px;max-width:min(240px,58vw);background:#fff8ec;color:#3b1a5c;border:4px solid #3b1a5c;border-radius:22px;padding:10px 14px 8px;box-shadow:0 6px 0 #3b1a5c,0 0 22px rgba(255,190,60,.45);transform-origin:0 100%;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1)}
#abuela.in .bubble{opacity:1;transform:none;transition-delay:.25s}
#abuela .bubble::before{content:"";position:absolute;left:-17px;bottom:16px;border:12px solid transparent;border-right:16px solid #3b1a5c;border-left:0}
#abuela .bubble::after{content:"";position:absolute;left:-10px;bottom:19px;border:9px solid transparent;border-right:12px solid #fff8ec;border-left:0}
#abuela .bubble p{margin:0;font:400 19px/1.18 LilitaOne,system-ui}
#abuela .bubble small{display:block;margin-top:4px;font:700 9px system-ui;letter-spacing:.14em;text-transform:uppercase;color:#a07ab8;text-align:right}
@media (prefers-reduced-motion:reduce){#abuela,#abuela.in{transition:none}#abuela.in img{animation:none}}
#boomflash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,240,190,.85),rgba(255,140,40,.35) 45%,rgba(255,80,20,0) 75%)}
#boomflash.on{animation:boomf .5s ease-out}@keyframes boomf{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#bomb.ready{animation:none}#boomflash.on{animation:none}}
#fire{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 40px);z-index:6;width:100px;height:100px;border-radius:50%;padding:0;border:5px solid #3b1a5c;background:radial-gradient(circle at 50% 36%,#7a35ad,#46196b 58%,#24092f);box-shadow:0 7px 0 #1a0826,inset 0 0 0 4px #ffd23f;cursor:pointer;touch-action:none;transition:filter .2s,transform .09s,box-shadow .09s;display:flex;align-items:center;justify-content:center}
#fire img{width:84px;height:auto;pointer-events:none;filter:drop-shadow(0 4px 2px rgba(0,0,0,.55));transform:rotate(-24deg) translateY(-3px)}
#fire .tap{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);font:400 13px LilitaOne,system-ui;letter-spacing:.08em;color:#ffd23f;-webkit-text-stroke:3px #3b1a5c;paint-order:stroke fill;white-space:nowrap;pointer-events:none}
#fire.ready{animation:fglow 1.25s ease-in-out infinite}
#fire.ready img{animation:fbob 1.25s ease-in-out infinite}
@keyframes fglow{0%,100%{box-shadow:0 7px 0 #1a0826,inset 0 0 0 4px #ffd23f,0 0 8px 2px rgba(255,210,63,.35)}50%{box-shadow:0 7px 0 #1a0826,inset 0 0 0 4px #fff2a8,0 0 26px 9px rgba(255,210,63,.8)}}
@keyframes fbob{50%{transform:rotate(-16deg) translateY(-7px) scale(1.07)}}
#fire.press{transform:translateY(5px) scale(.9);animation:none}
#fire.busy{filter:saturate(.4) brightness(.7);animation:none}
#fire.busy img{animation:none;opacity:.55}
#fire.rapid{background:radial-gradient(circle at 50% 38%,#ffd27a,#ff6a1a 52%,#b5121b);filter:none!important;animation:rglow .22s ease-in-out infinite alternate!important}
#fire.rapid img{animation:rshake .12s linear infinite alternate!important;opacity:1!important}
@keyframes rglow{from{box-shadow:0 7px 0 #1a0826,inset 0 0 0 4px #ffd23f,0 0 18px 6px rgba(255,120,20,.7)}to{box-shadow:0 7px 0 #1a0826,inset 0 0 0 4px #fff2a8,0 0 34px 14px rgba(255,170,40,.95)}}
@keyframes rshake{from{transform:rotate(-30deg) translateY(-4px) scale(1.05)}to{transform:rotate(-18deg) translateY(-7px) scale(1.12)}}
#rapid{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 98px);transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:linear-gradient(180deg,#ffb030,#ff5a1a 55%,#e2197a);border:3px solid #3b1a5c;box-shadow:0 4px 0 #3b1a5c,0 0 24px rgba(255,140,26,.85);font:400 18px LilitaOne,system-ui;color:#fff;-webkit-text-stroke:3px #3b1a5c;paint-order:stroke fill;white-space:nowrap;pointer-events:none}
#rapid .rb{width:64px;height:12px;border-radius:7px;background:#3b1a5c;overflow:hidden;border:2px solid #3b1a5c}#rapid .rb i{display:block;height:100%;width:calc(var(--p,1)*100%);background:linear-gradient(90deg,#fff2a8,#ffd23f)}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 32%);text-align:center;font:800 15px system-ui;color:#fff;text-shadow:0 2px 4px #000,0 0 10px #000;z-index:5;pointer-events:none;transition:opacity .4s;padding:0 20px}
#hint.gone{opacity:0}
#hurt{position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(232,30,40,.85);opacity:0;transition:opacity .5s}
#hurt.on{opacity:1;transition:none}
#fx{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font:400 24px LilitaOne,system-ui;color:#fff;-webkit-text-stroke:4px #3b1a5c;paint-order:stroke fill;animation:rise 1s ease-out forwards;white-space:nowrap}
.pop.big{font-size:30px;color:#ffd23f}.pop.bad{color:#ff5a6a}
@keyframes rise{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}15%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.combo{position:absolute;left:0;right:0;top:27%;text-align:center;z-index:8;pointer-events:none;font:400 48px LilitaOne,system-ui;color:#ffd23f;-webkit-text-stroke:7px #3b1a5c;paint-order:stroke fill;text-shadow:0 6px 0 #3b1a5c;opacity:0}
.combo.show{animation:comic 1.1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes comic{0%{opacity:0;transform:rotate(-14deg) scale(.3)}18%{opacity:1;transform:rotate(-6deg) scale(1.15)}70%{opacity:1;transform:rotate(-8deg) scale(1)}100%{opacity:0;transform:rotate(-8deg) scale(1.05) translateY(-20px)}}
/* Sit in the open plaza, fully below the hanging papel picado (and the hearts).
   Anchored from mid-screen so tall and short phones keep a clear gap under the flags.
   The settle animation rises slightly from below, never up into the bunting. */
.banner{position:absolute;left:0;right:0;top:auto;bottom:46%;text-align:center;z-index:6;pointer-events:none;opacity:0;padding:0 8px}
.banner b{display:block;font:400 clamp(28px, 9vw, 44px) LilitaOne,system-ui;color:#fff;-webkit-text-stroke:6px #3b1a5c;paint-order:stroke fill;text-shadow:0 5px 0 #3b1a5c;line-height:1.05}
.banner span{display:inline-block;margin-top:6px;font:700 13px system-ui;letter-spacing:.14em;text-transform:uppercase;background:#ffd23f;color:#3b1a5c;border-radius:999px;padding:4px 12px}
.banner.show{animation:ban 2.1s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translateY(16px) scale(.8)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
@media (max-height:700px){
  .banner{bottom:44%}
  .banner b{font-size:clamp(26px, 8.4vw, 36px);-webkit-text-stroke-width:5px;text-shadow:0 4px 0 #3b1a5c}
  .banner span{font-size:12px;padding:3px 10px;margin-top:4px}
}
@media (min-height:820px){ .banner{bottom:48%} }
@keyframes pop{50%{transform:scale(1.15)}}
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(61,23,96,.7),rgba(10,3,15,.88));padding:16px}
.card{position:relative;z-index:22;width:min(360px,100%);text-align:center;background:radial-gradient(ellipse at 50% 25%,#4a1f6e,#24092f 72%);border:4px solid #ffd23f;border-radius:26px;padding:18px 18px 20px;box-shadow:0 0 0 4px #14050f,0 0 40px rgba(255,190,60,.35),0 18px 40px rgba(0,0,0,.6);animation:cardin .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardin{from{transform:scale(.7);opacity:0}}
#title .card{padding:28px 22px 24px}
#title .relic{width:168px;margin:6px auto 4px}
#title:not(.hidden) ~ .cz-copy{visibility:hidden}
/* title screen = only the gold chancla and TAP TO PLAY: no HUD, hearts, hint, fire or bomb button until play starts */
#stage.on-title .hud,#stage.on-title #hearts,#stage.on-title #powers,#stage.on-title #fire,#stage.on-title #hint,#stage.on-title #rapid,#stage.on-title #stickyHint{display:none!important}
.card h1{margin:0;font:400 44px LilitaOne,system-ui;color:#ffd23f;-webkit-text-stroke:7px #3b1a5c;paint-order:stroke fill;text-shadow:0 5px 0 #3b1a5c;line-height:1.05}
.card .sub{margin:8px 0 4px;font:600 14px/1.35 system-ui;color:#ffe9c2}
.hero{height:150px;display:block;margin:-70px auto 2px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.relic{width:150px;display:block;margin:-62px auto 0;filter:drop-shadow(0 0 18px rgba(255,200,60,.8)) drop-shadow(0 8px 8px rgba(0,0,0,.6));animation:relic 2.2s ease-in-out infinite}
@keyframes relic{50%{transform:translateY(-8px) rotate(-6deg)}}
.stats{display:flex;justify-content:center;gap:10px;margin:10px 0 2px}
.stat{background:#14050f;border-radius:14px;padding:6px 12px;min-width:92px}
.stat small{display:block;font:700 10px system-ui;letter-spacing:.14em;text-transform:uppercase;color:#c9b39a}
.stat b{font:400 26px LilitaOne,system-ui;color:#ffd23f}
.small{font:600 13px system-ui;color:#c9b39a;margin:6px 0 4px;min-height:1em}
.btn{display:inline-block;font:400 26px LilitaOne,system-ui;color:#3b1a5c;text-decoration:none;background:linear-gradient(180deg,#9dff7a,#3cc85a 50%,#239a3f);border:4px solid #3b1a5c;border-radius:999px;padding:8px 40px;box-shadow:0 6px 0 #3b1a5c;cursor:pointer;margin-top:8px}
.btn.gold{background:linear-gradient(180deg,#fff2a8,#ffd23f 45%,#f4a000)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #3b1a5c}
.link{display:block;margin-top:12px;color:#ffd23f;font:600 14px system-ui}

.menu{display:flex;flex-direction:column;gap:10px;align-items:center}
.xbtn{display:inline-flex;align-items:center;gap:8px;background:#000;color:#fff;border:3px solid #fff;border-radius:999px;padding:8px 20px;font:700 15px system-ui;text-decoration:none;margin-top:10px}
.cz-copy{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(4px,env(safe-area-inset-bottom)) + 6px);z-index:30;pointer-events:none;font:10px system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.9);display:flex;align-items:center;gap:8px;white-space:nowrap}
/* popups = buttons (and a little stroked text) floating over the live game: no panel, no box, no dim (Gabe, 2026-11-10) */
.screen{background:none!important}
#title.screen{align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 30%)}
.card{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0}
.card .sub,.card .small,.link{text-shadow:0 2px 3px #000,0 0 10px #000,0 0 18px rgba(0,0,0,.8)}
.card .sub{font-size:16px;color:#fff}
.stat{background:none!important;padding:0 6px!important}
.stat small{color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000}
.stat b{font-size:34px;-webkit-text-stroke:6px #3b1a5c;paint-order:stroke fill;text-shadow:0 4px 0 #3b1a5c}
#title .gname{margin:0 auto 18px;max-width:92%;text-align:center;font-size:clamp(30px,8.6vw,56px);text-shadow:0 5px 0 #3b1a5c,0 0 24px rgba(255,140,26,.8)}
#title .btn{font-size:30px;padding:10px 46px;box-shadow:0 6px 0 #3b1a5c,0 0 30px rgba(255,200,60,.75);animation:pbreath 1.6s ease-in-out infinite}
@keyframes pbreath{50%{transform:scale(1.06)}}
.btn{box-shadow:0 6px 0 #3b1a5c,0 0 22px rgba(0,0,0,.55)}
/* start screen only: the name, one chanclazo line, and TAP TO PLAY */
#title.screen{align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,rgba(61,23,96,.55),rgba(10,3,15,.72))!important}
#title .card{width:min(440px,100%);background:radial-gradient(ellipse at 50% 18%,#4a1f6e,#24092f 74%)!important;border:4px solid #ffd23f!important;border-radius:26px!important;padding:22px 16px 18px!important;box-shadow:0 0 0 4px #14050f,0 0 40px rgba(255,190,60,.35),0 18px 40px rgba(0,0,0,.6)!important}
#title .gname{margin:0 auto 8px;font-size:clamp(26px,7vw,44px)}
#title .quote{margin:2px 10px 12px;min-height:2.6em;font:700 16px/1.35 system-ui,sans-serif;color:#ffe9c2;text-shadow:0 2px 0 #14050f}
@media (prefers-reduced-motion:reduce){#title .btn{animation:none}#fire.ready,#fire.ready img,.relic{animation:none}}
</style>
</head><body>
<div id="stage">
  <div class="hud">
    <button class="hbtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><rect x="5" y="3" width="5" height="18" rx="1.6" fill="#ffd23f"/><rect x="14" y="3" width="5" height="18" rx="1.6" fill="#ffd23f"/></svg></button>
    <div class="lvlbox"><div id="wave">Wave 1</div><div class="barwrap" role="progressbar" aria-label="Wave progress"><div id="bar"></div></div></div>
    <div class="score" id="scoreBox" aria-label="Score"><span id="score">0</span></div>
    <button id="mute" aria-label="Sound on or off">🔊</button>
  </div>
  <div id="hearts" aria-label="Lives"></div>
  <div id="hurt"></div>
  <div id="banner" class="banner"></div>
  <div id="combo" class="combo"></div>
  <div id="fx"></div>
  <div id="hint" class="gone">Tap a kid to throw · or tap the gold chancla</div>
  <div id="rapid" class="hidden" aria-live="polite">🔥 RAPID FIRE <span class="rb"><i></i></span></div>
  <div id="powers"><button id="snack" class="ready" aria-label="Throw a pan dulce. A sugar skull stops to eat it."><img src="/waves/snack-concha-icon.webp" alt="" width="52" height="52" /><span id="snackN" class="bn">2</span><span class="use">TAP</span></button><button id="bomb" class="ghost" aria-label="Drop a gold chancla bomb" aria-disabled="true"><img src="/crash/chancla-btn.webp" alt="" width="54" height="30" /><span class="bb">💣</span><span id="bombN" class="bn">0</span><span class="use">TAP</span></button><button id="sticky" class="ghost" aria-label="Plant a sticky chancla on the marigold line. It holds kids and throws for you." aria-disabled="true"><img src="/crash/chancla-btn.webp" alt="" width="54" height="30" /><span id="stickyN" class="bn">0</span><span class="use">TAP</span></button></div><div id="stickyHint">TAP A LANE TO PLANT</div>
  <div id="abuela" role="status" aria-live="polite" aria-label="Abuela says"><img id="abuelaImg" alt="Abuela" width="507" height="1002" /><div class="bubble"><p id="abuelaLine"></p><small>tap to skip</small></div></div>
  <div id="boomflash" aria-hidden="true"></div>
  <button id="fire" aria-label="Throw the gold chancla at the closest kid"><img src="/crash/chancla-btn.webp" alt="" width="84" height="47" /><span class="tap">TAP!</span></button>

  <div class="screen hidden" id="title"><div class="card">
    <h1 class="gname">%%WAVES_NAME%%</h1>
    <p class="quote" id="titleQuote"></p>
    <button class="btn gold" id="play" aria-label="Tap to play %%WAVES_NAME%%">TAP TO PLAY</button>
  </div></div>

  <div class="screen hidden" id="pause"><div class="card menu">
    <h1>Paused</h1>
    <button class="btn" id="resume">RESUME</button>
    <button class="btn gold" id="restart">RESTART</button>
    <a class="link" href="/choose">All games</a>
  </div></div>

  <div class="screen hidden" id="over"><div class="card">
    <h1>¡Ay, no!</h1>
    <p class="sub">The kids made it to the ofrenda.</p>
    <div class="stats"><div class="stat"><small>Wave</small><b id="oWave">1</b></div><div class="stat"><small>Score</small><b id="oScore">0</b></div></div>
    <p class="small" id="oBest"></p>
    <button class="btn gold" id="retry">PLAY AGAIN</button>
    <div><a class="xbtn" id="share" href="https://x.com/intent/post" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Share on X</a></div>
    <a class="link" href="/choose">All games</a>
  </div></div>

  <div class="cz-copy">© 2023 Chanclazo™ <span class="cz-build" style="font-size:8px;letter-spacing:.08em;text-transform:none;opacity:.6">%%CZ_BUILD%%</span></div>
</div>
<script type="module" src="/src/play/waves.ts"></script>
<script type="module" src="/src/analytics-boot.ts"></script>
</body></html>
