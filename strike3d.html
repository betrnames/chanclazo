<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#14061f" />
<meta name="robots" content="noindex" />
<title>Chancla Strike 3D (prototype) · Chanclazo</title>
<link rel="icon" href="/cruise/logo_chancla.webp" />
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@font-face{font-family:LilitaOne;src:url(/fonts/LilitaOne-Regular.ttf) format("truetype");font-display:swap}
html,body{margin:0;height:100%;background:#0b0312 url(/play/night_bg.webp) center/cover;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;background:rgba(8,2,14,.72)}
#stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100vh * 9 / 16));overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.8)}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top);display:flex;align-items:flex-start;gap:6px;padding:8px;z-index:5;pointer-events:none}
.hud a,.hud button,.pill{pointer-events:auto;background:rgba(36,9,47,.88);border:2px solid #ffb347;border-radius:12px;color:#ffd23f;font-weight:900;padding:5px 8px;font-size:12px;text-decoration:none;cursor:pointer;line-height:1.15}
.pill{display:flex;flex-direction:column;color:#fff;pointer-events:none}.pill small{font-size:9px;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
.sp{flex:1}
#wind{position:absolute;top:58px;left:50%;transform:translateX(-50%);font:800 12px system-ui;color:#ffd23f;text-shadow:0 1px 3px #000;z-index:5;pointer-events:none}
#hint{position:absolute;bottom:56px;left:0;right:0;text-align:center;font:800 13px system-ui;color:#fff;text-shadow:0 1px 4px #000;z-index:5;pointer-events:none;opacity:.9}
#warn{position:absolute;top:40%;left:0;right:0;text-align:center;font:400 34px LilitaOne,system-ui;color:#ff4d6d;text-shadow:0 3px 0 #2a0010;z-index:6;pointer-events:none;display:none}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,3,15,.78);z-index:10;padding:16px}
.hidden{display:none!important}
.card{background:radial-gradient(ellipse at 50% 30%,#3a1556,#160620 72%);border:3px solid #ffb347;border-radius:20px;padding:20px;max-width:360px;width:100%;text-align:center;box-shadow:0 0 36px rgba(255,170,60,.3)}
.card h1{margin:4px 0 8px;font:400 34px LilitaOne,system-ui;color:#ffd23f}
.card p{margin:0 0 10px;font-size:15px}
.stars{font-size:40px;letter-spacing:6px;color:#ffd23f}.stars .off{color:#4a3358}
.card button{font:400 22px LilitaOne,system-ui;background:#ffd23f;color:#2a0a00;border:3px solid #fff;border-radius:14px;padding:10px 24px;cursor:pointer;margin:4px}
.card a{color:#ffd23f;font-size:13px}
/* comic */
#comic{position:absolute;inset:0;z-index:20;background:#0b0312;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 14px 70px}
.panel{position:relative;width:100%;aspect-ratio:3/4;max-height:100%;border:5px solid #000;outline:3px solid #ffd23f;border-radius:6px;overflow:hidden;background:#1a0826 center/cover;box-shadow:0 10px 30px rgba(0,0,0,.7);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.panel img{position:absolute;bottom:0;object-fit:contain}
.cap{position:absolute;left:8px;right:8px;top:8px;background:#ffd23f;color:#1a0826;border:3px solid #000;padding:6px 10px;font:800 14px/1.3 system-ui;text-transform:uppercase;letter-spacing:.3px}
.bub{position:absolute;background:#fff;color:#111;border:3px solid #000;border-radius:18px;padding:8px 12px;font:400 19px/1.15 LilitaOne,system-ui;max-width:62%}
.bub::after{content:"";position:absolute;bottom:-16px;left:var(--tx,30%);border:9px solid transparent;border-top:14px solid #000}
.fx{position:absolute;font:400 54px LilitaOne,system-ui;color:#ffd23f;-webkit-text-stroke:3px #5a1a00;transform:rotate(-12deg)}
#skip{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;z-index:21;font:900 14px system-ui;background:#24092f;color:#ffd23f;border:2px solid #ffd23f;border-radius:12px;padding:8px 14px;cursor:pointer}
#tap{position:absolute;bottom:34px;left:0;right:0;text-align:center;font:800 13px system-ui;color:#ffd23f;opacity:.85}
.cz-copy{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(4px,env(safe-area-inset-bottom)) + 6px);z-index:30;pointer-events:none;font:10px system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.7);display:flex;align-items:center;gap:8px;white-space:nowrap}
</style>
</head><body>
<div id="stage">
  <div class="hud">
    <a href="/choose" aria-label="Back to game selection">← Games</a>
    <span class="pill"><small>Level</small><span id="lvl">1</span></span>
    <span class="pill"><small>Score</small><span id="score">0</span></span>
    <span class="sp"></span>
    <span class="pill"><small>Chanclas</small><span id="ammo">0</span></span>
    <span class="pill"><small>Hearts</small><span id="hearts">❤❤❤</span></span>
    <button id="mute" aria-label="Sound on or off">🔊</button>
  </div>
  <div id="wind"></div>
  <div id="warn">DODGE!</div>
  <div id="hint">Swipe up to throw · swipe left/right to dodge</div>
  <div class="screen hidden" id="end"><div class="card">
    <h1 id="endTitle">¡Chanclazo!</h1>
    <div class="stars" id="stars"></div>
    <p id="endMsg"></p>
    <button id="next">Next level</button>
    <button id="retry">Retry</button>
    <div><a href="/choose">← All games</a></div>
  </div></div>
  <div id="comic" class="hidden"><button id="skip">Skip ›</button><div id="panelWrap" style="width:100%;display:flex;justify-content:center"></div><div id="tap">Tap to continue</div></div>
  <div class="cz-copy">© 2023 Chanclazo™ <a href="https://x.com/ChanclaStrike" target="_blank" rel="noopener" aria-label="Chanclazo on X (@ChanclaStrike)" style="pointer-events:auto;color:inherit;text-decoration:none;text-transform:none;letter-spacing:.05em;display:inline-flex;align-items:center;gap:4px"><svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true" style="vertical-align:-1px;fill:currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>@ChanclaStrike</a><span class="cz-build" style="font-size:8px;letter-spacing:.08em;text-transform:none;opacity:.6">%%CZ_BUILD%%</span></div>
</div>
<script type="module" src="/src/play/strike3d.ts"></script>
<script type="module" src="/src/analytics-boot.ts"></script>
</body></html>
